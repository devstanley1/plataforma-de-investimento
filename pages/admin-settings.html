<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Netflix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Settings</h1>
            <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8">
                <form class="space-y-4 max-w-lg">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Withdraw Tax (%)</label>
                        <input type="number" value="7"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Minimum Withdraw (R$)</label>
                        <input type="number" value="1.00"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>
                    <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Save
                        Configuration</button>
                </form>
            </div>
        </div>
    </main>
    <script src="../assets/admin-sidebar.js"></script>
</body>

</html>
