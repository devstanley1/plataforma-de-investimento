<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Netflix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen text-white">
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Configurações da Plataforma</h1>

            <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 p-8">
                <form id="settings-form" class="space-y-6 max-w-2xl">

                    <!-- Taxa de Saque -->
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Taxa de Saque (%)</label>
                        <input type="number" step="0.01" id="conf-withdraw_tax_percent" name="withdraw_tax_percent"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                        <p class="text-gray-600 text-xs mt-1">Porcentagem descontada automaticamente de cada saque.</p>
                    </div>

                    <!-- Saque Mínimo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Saque Mínimo (R$)</label>
                        <input type="number" step="0.01" id="conf-min_withdraw_amount" name="min_withdraw_amount"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <!-- Bônus de Boas-vindas -->
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Bônus de Cadastro (R$)</label>
                        <input type="number" step="0.01" id="conf-welcome_bonus" name="welcome_bonus"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                        <p class="text-gray-600 text-xs mt-1">Valor creditado automaticamente ao se registrar.</p>
                    </div>

                    <!-- URL Gateway -->
                    <div>
                        <label class="block text-sm font-medium text-gray-400">URL do Gateway (Vizzion/Ghostpay)</label>
                        <input type="text" id="conf-pix_gateway_url" name="pix_gateway_url"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <div class="pt-4 border-t border-zinc-800">
                        <button type="submit"
                            class="w-full md:w-auto bg-red-600 text-white font-bold py-3 px-8 rounded hover:bg-red-700 transition-colors shadow-lg shadow-red-900/20">
                            Salvar Configurações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/admin-sidebar.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const SUPABASE_URL = 'https://hnbwamaqdmfdwaqtyxkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYndhbWFxZG1mZHdhcXR5eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMTYxMTIsImV4cCI6MjA4NDg5MjExMn0.cOKmgk3KtuvpP2UQWUiDOwp_AC9T__EAnFODTtn95zs';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('settings-form');
        const keysToLoad = ['withdraw_tax_percent', 'min_withdraw_amount', 'welcome_bonus', 'pix_gateway_url'];

        // Carregar configurações
        async function loadSettings() {
            const { data, error } = await supabase.from('system_config').select('*').in('key', keysToLoad);
            if (error) {
                console.error('Erro ao buscar configs:', error);
                return;
            }

            data.forEach(item => {
                const input = document.getElementById(`conf-${item.key}`);
                if (input) input.value = item.value;
            });
        }

        // Salvar
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const updates = keysToLoad.map(key => ({
                key: key,
                value: document.getElementById(`conf-${key}`).value,
                updated_at: new Date()
            }));

            const { error } = await supabase.from('system_config').upsert(updates);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('Configurações salvas com sucesso!');
            }
        });

        loadSettings();
    </script>

</body>

</html>
