<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Netflix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen text-white">
    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Settings</h1>
            <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 p-8">
                <form class="space-y-6 max-w-lg">
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Withdraw Tax (%)</label>
                        <input type="number" value="7"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Minimum Withdraw (R$)</label>
                        <input type="number" value="1.00"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>
                    <button type="button"
                        class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded hover:bg-red-700 transition-colors">Save
                        Configuration</button>
                </form>
            </div>
        </div>
    </main>
    <script src="../assets/admin-sidebar.js"></script>
</body>

</html>
