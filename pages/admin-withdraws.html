<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Withdraws - Netflix Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/styles.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Mantendo estilos específicos da tabela se necessário, ou migrando para Tailwind */
  </style>
</head>

<body class="bg-black min-h-screen text-white">

  <!-- Sidebar injetada via JS -->

  <main class="p-6">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Customer Withdraws</h1>

      <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-zinc-800" id="withdraw-table">
            <thead class="bg-black">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Usuário (ID)
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Valor</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Chave Pix
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Ações</th>
              </tr>
            </thead>
            <tbody class="bg-zinc-900 divide-y divide-zinc-800" id="withdraw-body">
              <tr>
                <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/admin-sidebar.js"></script>
  <script src="../assets/admin-withdraw.js"></script>
</body>

</html>
