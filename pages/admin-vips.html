<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIPs - Netflix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen text-white">
    <!-- Sidebar via JS -->

    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Gerenciar Níveis VIP</h1>

            <!-- Form -->
            <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 p-6 mb-8">
                <h2 class="text-xl font-semibold text-white mb-4" id="form-title">Novo Nível VIP</h2>
                <form id="vip-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="vip-id">

                    <div>
                        <label class="block text-sm font-medium text-gray-400">Nome do Nível</label>
                        <input type="text" id="vip-name" required placeholder="Ex: VIP 1"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400">Depósito Mínimo (R$)</label>
                        <input type="number" step="0.01" id="vip-min" required placeholder="Ex: 100.00"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400">Bônus Diário (%)</label>
                        <input type="number" step="0.01" id="vip-bonus" placeholder="Ex: 0.5"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400">Saques/Dia</label>
                        <input type="number" id="vip-withdraws" placeholder="Ex: 1"
                            class="mt-2 block w-full rounded-md border-zinc-700 bg-black text-white shadow-sm focus:border-red-600 focus:ring-red-600 sm:text-sm p-3 border">
                    </div>

                    <div class="md:col-span-2 flex justify-end gap-2 mt-4">
                        <button type="button" id="btn-cancel"
                            class="hidden px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded transition-colors">Cancelar</button>
                        <button type="submit"
                            class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded transition-colors">Salvar
                            VIP</button>
                    </div>
                </form>
            </div>

            <!-- Lista -->
            <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm text-gray-400">
                        <thead class="bg-black text-xs uppercase font-medium border-b border-zinc-800">
                            <tr>
                                <th class="px-6 py-3">Nível</th>
                                <th class="px-6 py-3">Depósito Mín (R$)</th>
                                <th class="px-6 py-3">Bônus Diário</th>
                                <th class="px-6 py-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="vips-body" class="divide-y divide-zinc-800">
                            <tr>
                                <td colspan="4" class="px-6 py-4 text-center">Carregando VIPs...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/admin-sidebar.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const SUPABASE_URL = 'https://hnbwamaqdmfdwaqtyxkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYndhbWFxZG1mZHdhcXR5eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMTYxMTIsImV4cCI6MjA4NDg5MjExMn0.cOKmgk3KtuvpP2UQWUiDOwp_AC9T__EAnFODTtn95zs';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('vip-form');
        const tbody = document.getElementById('vips-body');
        const cancelBtn = document.getElementById('btn-cancel');
        let editingId = null;

        // Buscar VIPs
        async function fetchVips() {
            // Tenta buscar da tabela vip_levels
            const { data, error } = await supabase
                .from('vip_levels')
                .select('*')
                .order('min_deposit', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">${error.message}</td></tr>`;
                return;
            }

            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center">Nenhum VIP cadastrado. Use o formulário para criar.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(vip => `
          <tr class="hover:bg-zinc-800 transition-colors">
            <td class="px-6 py-4 font-bold text-white">${vip.name}</td>
            <td class="px-6 py-4">R$ ${Number(vip.min_deposit).toFixed(2)}</td>
            <td class="px-6 py-4 text-green-400">${vip.daily_bonus_percent || 0}%</td>
            <td class="px-6 py-4 text-right space-x-2">
              <button onclick="window.editVip('${vip.id}')" class="text-blue-400 hover:text-blue-300">Editar</button>
              <button onclick="window.deleteVip('${vip.id}')" class="text-red-500 hover:text-red-400">Excluir</button>
            </td>
          </tr>
        `).join('');

            window.vipsCache = data;
        }

        // Salvar
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('vip-name').value,
                min_deposit: document.getElementById('vip-min').value,
                daily_bonus_percent: document.getElementById('vip-bonus').value,
                max_withdraw_per_day: document.getElementById('vip-withdraws').value
            };

            let error = null;
            if (editingId) {
                const { error: err } = await supabase.from('vip_levels').update(payload).eq('id', editingId);
                error = err;
            } else {
                const { error: err } = await supabase.from('vip_levels').insert([payload]);
                error = err;
            }

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                resetForm();
                fetchVips();
            }
        });

        // Editar
        window.editVip = (id) => {
            const vip = window.vipsCache.find(v => v.id === id);
            if (!vip) return;

            editingId = id;
            document.getElementById('vip-id').value = id;
            document.getElementById('vip-name').value = vip.name;
            document.getElementById('vip-min').value = vip.min_deposit;
            document.getElementById('vip-bonus').value = vip.daily_bonus_percent;
            document.getElementById('vip-withdraws').value = vip.max_withdraw_per_day;

            document.getElementById('form-title').innerText = 'Editar Nível VIP';
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Excluir
        window.deleteVip = async (id) => {
            if (!confirm('Tem certeza?')) return;
            const { error } = await supabase.from('vip_levels').delete().eq('id', id);
            if (error) alert('Erro ao excluir: ' + error.message);
            else fetchVips();
        };

        function resetForm() {
            form.reset();
            editingId = null;
            document.getElementById('form-title').innerText = 'Novo Nível VIP';
            cancelBtn.classList.add('hidden');
        }
        cancelBtn.addEventListener('click', resetForm);

        fetchVips();
    </script>
</body>

</html>
