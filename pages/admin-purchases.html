<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purchase Record - Netflix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen text-white">

    <!-- Sidebar via JS -->

    <main class="p-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Purchase Record</h1>

            <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-zinc-800" id="purchases-table">
                        <thead class="bg-black">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    ID</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    User ID</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    Product ID</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    Invested Amount</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    Start Date</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                    Status</th>
                            </tr>
                        </thead>
                        <tbody class="bg-zinc-900 divide-y divide-zinc-800" id="purchases-body">
                            <tr>
                                <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">Loading purchases...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/admin-sidebar.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const SUPABASE_URL = 'https://hnbwamaqdmfdwaqtyxkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYndhbWFxZG1mZHdhcXR5eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMTYxMTIsImV4cCI6MjA4NDg5MjExMn0.cOKmgk3KtuvpP2UQWUiDOwp_AC9T__EAnFODTtn95zs';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        (async () => {
            // Buscando investimentos
            const { data: investments, error } = await supabase
                .from('investments')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);

            const tbody = document.getElementById('purchases-body');
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Error: ${error.message}</td></tr>`;
                return;
            }

            if (!investments || !investments.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No purchases found.</td></tr>`;
                return;
            }

            tbody.innerHTML = investments.map(inv => `
           <tr class="hover:bg-black transition-colors">
             <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400 font-mono">${inv.id.slice(0, 8)}...</td>
             <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300 font-mono">${inv.user_id.slice(0, 8)}...</td>
             <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${inv.product_id.slice(0, 8)}...</td>
             <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-white">R$ ${Number(inv.amount).toFixed(2)}</td>
             <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(inv.start_date || inv.created_at).toLocaleDateString()}</td>
             <td class="px-6 py-4 whitespace-nowrap">
               <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${inv.status === 'ACTIVE' ? 'bg-green-900/30 text-green-400 border border-green-800' : 'bg-zinc-800 text-gray-400 border border-zinc-700'
                }">
                 ${inv.status}
               </span>
             </td>
           </tr>
         `).join('');
        })();
    </script>
</body>

</html>
