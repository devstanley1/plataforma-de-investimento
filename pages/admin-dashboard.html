<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Netflix Admin</title>
    <!-- Usando Tailwind via CDN para prototipagem rápida e visual premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    
    <!-- O Sidebar será injetado aqui pelo admin-sidebar.js -->

    <main class="p-6">
      <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <!-- Card 1 -->
          <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-medium text-gray-500">Usuários Totais</h3>
              <span class="text-blue-500 bg-blue-100 p-2 rounded-full">👥</span>
            </div>
            <p class="text-3xl font-bold text-gray-900" id="stat-users">-</p>
            <p class="text-xs text-green-600 mt-2">↑ Novos hoje</p>
          </div>

          <!-- Card 2 -->
          <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-medium text-gray-500">Depósitos Hoje</h3>
              <span class="text-green-500 bg-green-100 p-2 rounded-full">💰</span>
            </div>
            <p class="text-3xl font-bold text-gray-900" id="stat-deposits">R$ -</p>
            <p class="text-xs text-gray-500 mt-2">Total arrecadado</p>
          </div>

          <!-- Card 3 -->
          <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-medium text-gray-500">Saques Pendentes</h3>
              <span class="text-orange-500 bg-orange-100 p-2 rounded-full">⏳</span>
            </div>
            <p class="text-3xl font-bold text-gray-900" id="stat-withdraws">-</p>
            <p class="text-xs text-orange-600 mt-2">Precisam de aprovação</p>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-6 border-b border-gray-100">
            <h3 class="text-lg font-semibold text-gray-900">Atividades Recentes</h3>
          </div>
          <div class="p-6 text-center text-gray-500 text-sm">
            Nenhuma atividade recente encontrada.
          </div>
        </div>
      </div>
    </main>

    <script src="../assets/admin-sidebar.js"></script>
    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      // Configuração básica para buscar stats (mock ou real se tiver endpoints)
      // Por enquanto, apenas o esqueleto visual.
      document.getElementById('stat-users').innerText = '1,234'; // Mock
      document.getElementById('stat-deposits').innerText = 'R$ 12.500'; // Mock
      document.getElementById('stat-withdraws').innerText = '5'; // Mock
    </script>
  </body>
</html>
