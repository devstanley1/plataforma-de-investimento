<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Netflix Admin</title>
  <!-- Usando Tailwind via CDN para prototipagem rápida e visual premium -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-black min-h-screen text-white">

  <!-- O Sidebar será injetado aqui pelo admin-sidebar.js -->

  <main class="p-6">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-bold text-white mb-8 tracking-tight">Dashboard</h1>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Card 1 -->
        <div class="bg-zinc-900 rounded-lg shadow-lg p-6 border border-zinc-800">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider">Usuários Totais</h3>
            <span class="text-blue-500 bg-blue-900/30 p-2 rounded-full">👥</span>
          </div>
          <p class="text-3xl font-bold text-white" id="stat-users">-</p>
          <p class="text-xs text-green-500 mt-2">↑ Novos hoje</p>
        </div>

        <!-- Card 2 -->
        <div class="bg-zinc-900 rounded-lg shadow-lg p-6 border border-zinc-800">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider">Depósitos Hoje</h3>
            <span class="text-green-500 bg-green-900/30 p-2 rounded-full">💰</span>
          </div>
          <p class="text-3xl font-bold text-white" id="stat-deposits">R$ -</p>
          <p class="text-xs text-gray-400 mt-2">Total arrecadado</p>
        </div>

        <!-- Card 3 -->
        <div class="bg-zinc-900 rounded-lg shadow-lg p-6 border border-zinc-800">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider">Saques Pendentes</h3>
            <span class="text-orange-500 bg-orange-900/30 p-2 rounded-full">⏳</span>
          </div>
          <p class="text-3xl font-bold text-white" id="stat-withdraws">-</p>
          <p class="text-xs text-orange-400 mt-2">Precisam de aprovação</p>
        </div>
      </div>

      <div class="bg-zinc-900 rounded-lg shadow-lg border border-zinc-800 overflow-hidden">
        <div class="p-6 border-b border-zinc-800">
          <h3 class="text-lg font-semibold text-white">Atividades Recentes</h3>
        </div>
        <div class="p-6 overflow-x-auto">
          <table class="min-w-full text-left text-sm text-gray-400">
            <thead class="border-b border-zinc-800 text-xs uppercase font-medium">
              <tr>
                <th class="px-4 py-2">Tipo</th>
                <th class="px-4 py-2">Usuário</th>
                <th class="px-4 py-2">Valor</th>
                <th class="px-4 py-2">Data</th>
              </tr>
            </thead>
            <tbody id="recent-activities-body">
              <tr>
                <td colspan="4" class="px-4 py-4 text-center">Carregando atividades...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/admin-sidebar.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://hnbwamaqdmfdwaqtyxkc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYndhbWFxZG1mZHdhcXR5eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzMTYxMTIsImV4cCI6MjA4NDg5MjExMn0.cOKmgk3KtuvpP2UQWUiDOwp_AC9T__EAnFODTtn95zs';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchDashboardData() {
      try {
        // 1. Total Usuários
        const { count: usersCount, error: usersError } = await supabase
          .from('profiles')
          .select('*', { count: 'exact', head: true });

        if (!usersError) {
          document.getElementById('stat-users').innerText = usersCount || 0;
        }

        // 2. Depósitos Hoje
        const today = new Date().toISOString().split('T')[0];
        const startOfDay = `${today}T00:00:00.000Z`;
        const endOfDay = `${today}T23:59:59.999Z`;

        const { data: payments, error: paymentsError } = await supabase
          .from('payments')
          .select('amount, status')
          .gte('created_at', startOfDay)
          .lte('created_at', endOfDay)
          .in('status', ['PAID', 'COMPLETED', 'paid', 'completed']);

        if (!paymentsError && payments) {
          const totalDeposits = payments.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
          document.getElementById('stat-deposits').innerText = `R$ ${totalDeposits.toFixed(2)}`;
        }

        // 3. Saques Pendentes
        const { count: withdrawsCount, error: withdrawsError } = await supabase
          .from('withdraw_requests')
          .select('*', { count: 'exact', head: true })
          .eq('status', 'pending');

        if (!withdrawsError) {
          document.getElementById('stat-withdraws').innerText = withdrawsCount || 0;
        }

        // 4. Atividades Recentes
        const { data: recentDeposits } = await supabase
          .from('payments')
          .select('id, amount, created_at, user_id, status')
          .order('created_at', { ascending: false })
          .limit(5);

        const { data: recentWithdraws } = await supabase
          .from('withdraw_requests')
          .select('id, amount, created_at, user_id, status')
          .order('created_at', { ascending: false })
          .limit(5);

        const activities = [
          ...(recentDeposits || []).map(d => ({ ...d, type: 'Depósito', color: 'text-green-500' })),
          ...(recentWithdraws || []).map(w => ({ ...w, type: 'Saque', color: 'text-red-500' }))
        ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);

        const tbody = document.getElementById('recent-activities-body');
        if (activities.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center">Nenhuma atividade recente.</td></tr>`;
        } else {
          tbody.innerHTML = activities.map(item => `
            <tr class="border-b border-zinc-800 hover:bg-zinc-800/50 transition-colors">
              <td class="px-4 py-3 font-medium ${item.color}">${item.type}</td>
              <td class="px-4 py-3 font-mono text-gray-300">${item.user_id ? item.user_id.slice(0, 8) + '...' : 'Anônimo'}</td>
              <td class="px-4 py-3 font-bold text-white">R$ ${Number(item.amount).toFixed(2)}</td>
              <td class="px-4 py-3 text-gray-500">${new Date(item.created_at).toLocaleTimeString()}</td>
            </tr>
          `).join('');
        }

      } catch (err) {
        console.error('Erro ao carregar dashboard:', err);
      }
    }

    fetchDashboardData();
  </script>
</body>

</html>
